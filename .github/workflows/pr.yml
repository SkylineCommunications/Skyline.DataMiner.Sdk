name: PR - Build and Test

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup NuGet sources
        uses: SkylineCommunications/_ReusableWorkflows/.github/actions/setup-nuget-sources@main
        with:
          repository-owner: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          include-skyline: 'false'

      - name: Restore
        shell: pwsh
        run: dotnet restore "Skyline.DataMiner.Sdk.sln"

      - name: Build
        shell: pwsh
        run: dotnet build "Skyline.DataMiner.Sdk.sln" --no-restore

      - name: Unit tests
        shell: pwsh
        run: dotnet test "Skyline.DataMiner.Sdk.sln" --no-build --filter "TestCategory!=IntegrationTest&TestCategory!=IntegrationTests"